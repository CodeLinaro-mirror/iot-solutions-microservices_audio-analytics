default:
  image: docker:25.0.3-dind
  tags:
    - arm64-runner
  before_script:
    # Start Docker daemon inside the job container
    - dockerd -l fatal &
    - sleep 5

variables:
  # Kubernetes resources
  KUBERNETES_CPU_REQUEST: "2"
  KUBERNETES_MEMORY_REQUEST: "8G"
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "32G"
  KUBERNETES_POD_ANNOTATIONS_1: "MOUNT_EFS=/data"

  # Docker image details
  IMAGE_REGISTRY: artifacts.codelinaro.org
  IMAGE_PATH: iot-solutions-microservices
  IMAGE_NAME: audio-analytics
  IMAGE_TAG: 1.0.4
  FULL_IMAGE_NAME: "${IMAGE_REGISTRY}/${IMAGE_PATH}/${IMAGE_NAME}:${IMAGE_TAG}"
  FULL_IMAGE_LATEST: "${IMAGE_REGISTRY}/${IMAGE_PATH}/${IMAGE_NAME}:latest"
  ARTIFACTORY_BASE_URL: "https://${IMAGE_REGISTRY}/artifactory/${IMAGE_PATH}-components/${IMAGE_NAME}"

  DOCKER_BUILDKIT: "1"
  TARGET_ARCH: "linux/arm64"

stages:
  - build
  - test

# ---------------------------------------------------------
# Build & push the image
# ---------------------------------------------------------
build-image:
  stage: build
  script:
    - echo "Checking Docker daemon"
    - docker version
    - docker info

    - echo "Logging into JFrog Docker registry"
    - echo "$JFROG_PASSWORD" | docker login -u "$JFROG_USERNAME" --password-stdin "$IMAGE_REGISTRY"

    - echo "Building Audio Analytics Docker Image (ARM64)"
    - docker build --build-arg INSTALL_NATIVE_LIBS=true --build-arg UBUNTU_VERSION=24.04 --build-arg ARTIFACTORY_BASE_URL=$ARTIFACTORY_BASE_URL --platform ${TARGET_ARCH} -t "$FULL_IMAGE_NAME" -f src/Dockerfile src/

    - echo "Tagging the just-built image as :latest"
    - docker tag "${FULL_IMAGE_NAME}" "${FULL_IMAGE_LATEST}"

    - echo "Pushing versioned image to Artifactory"
    - docker push "$FULL_IMAGE_NAME"

    - echo "Pushing :latest tag to Artifactory"
    - docker push "$FULL_IMAGE_LATEST"

# ---------------------------------------------------------
# Use the built image inside CI
# ---------------------------------------------------------

test-with-image:
  stage: test
  script:
    - echo "Logging into JFrog"
    - echo "$JFROG_PASSWORD" | docker login -u "$JFROG_USERNAME" --password-stdin "$IMAGE_REGISTRY"

    - echo "Running container from built image"
    - docker run --rm -v /data:/data "$FULL_IMAGE_NAME" bash -c "uname -a && cat /etc/os-release && df -h /data"